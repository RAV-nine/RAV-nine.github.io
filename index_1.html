label{display:block;font-size:.85rem;color:var(--dim);margin-top:10px}

button.b{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit}

.stats b{display:block;font:500 1.4rem Mitr,sans-serif;color:var(--acc)}
.lv{width:100%;border-collapse:collapse;font-size:.92rem}.lv td,.lv th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.lv tr.off{opacity:.38}.lv tr.sub td:nth-child(3){color:var(--acc)}
.pill{display:inline-block;padding:1px 9px;border:1px solid var(--line);border-radius:99px;margin:2px;font-size:.85rem}
.sl{border-color:var(--acc);color:var(--acc)}
.tag{font-size:.72rem;padding:0 7px;border-radius:4px;background:var(--line);margin-left:6px}.tag.cm{background:var(--red);color:#fff}

.list small{color:var(--dim);display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cards .card{margin:0}.muted{color:var(--dim);font-size:.9rem}
a{color:var(--acc)}
@media print{nav,.noprint{display:none}}

function fsc(){const add=[0,0,0,0,0,0];let boon=false;S.asi.forEach(p=>p.forEach(i=>{if(i>=0)add[i]++}));
FT.forEach(f=>{if(!S.ft[f[0]]||f[0]=='Ability Score Improvement')return;const o=ftOpts(f);if(o){const c=o.length==1?ABK.indexOf(o[0]):(S.fo[f[0]]||{}).a;if(typeof c=='number'&&c>=0)add[c]++}if(f[1]=='E')boon=true});
return S.sc.map((v,i)=>Math.min(boon?30:20,v+add[i]))}
function featSpells(){const r=[],o=S.fo;
if(S.ft['Magic Initiate']){const q=o['Magic Initiate']||{};(q.c||[]).concat(q.s||[]).filter(Boolean).forEach(n=>r.push([n,'Magic Initiate']))}
[['Fey-Touched','Misty Step'],['Shadow-Touched','Invisibility'],['Telekinetic','Mage Hand'],['Telepathic','Detect Thoughts']].forEach(([f,n])=>{if(S.ft[f]){r.push([n,f]);const p=(o[f]||{}).s;if(p)r.push([p,f])}});
if(S.ft['Spell Sniper']){const p=(o['Spell Sniper']||{}).s;if(p)r.push([p,'Spell Sniper'])}
return r}
function keep(fn){const y=scrollY;fn();render();scrollTo(0,y)}
function ftTog(el){keep(()=>{S.ft[el.value]=el.checked})}
function setFo(f,k,i,v){keep(()=>{const o=S.fo[f]=S.fo[f]||{};if(k=='cl'){o.cl=v;o.c=[];o.s='';return}if(i===null)o[k]=v;else{o[k]=o[k]||[];o[k][i]=v}})}
function setAsi(k,j,v){keep(()=>{S.asi[k][j]=v})}
function asiAdd(d){keep(()=>{if(d>0)S.asi.push([-1,-1]);else S.asi.pop()})}
const BYC=(c,lv)=>SPL.filter(s=>s[1]==lv&&s[3].includes(CC[c])).map(s=>s[0]);
function spSel(f,k,i,list,cur,label){return `<label>${label}</label><select onchange="setFo('${f}','${k}',${i},this.value)"><option value="">— เลือก —</option>${list.map(n=>`<option value="${esc(n)}" ${n==cur?'selected':''}>${n}</option>`).join('')}</select>`}
function featOpts(){let h='';
FT.filter(f=>S.ft[f[0]]&&f[0]!='Ability Score Improvement').forEach(f=>{const n=f[0],o=ftOpts(f),q=S.fo[n]||{};let x='';
if(o&&o.length>1)x+=`<label>เพิ่มค่าพลัง +1</label><select onchange="setFo('${n}','a',null,this.value===''?undefined:+this.value)"><option value="">— เลือก —</option>${o.map(a=>{const i=ABK.indexOf(a);return `<option value="${i}" ${q.a===i?'selected':''}>${a}</option>`}).join('')}</select>`;
else if(o)x+=`<p class="muted">ค่าพลัง ${o[0]} +1 (อัตโนมัติ)</p>`;
if(n=='Magic Initiate'){const cl=q.cl||'Cleric';x+=`<label>ลิสต์คาถา</label><select onchange="setFo('${n}','cl',null,this.value)">${['Cleric','Druid','Wizard'].map(c=>`<option ${c==cl?'selected':''}>${c}</option>`).join('')}</select>`+[0,1].map(i=>spSel(n,'c',i,BYC(cl,0),(q.c||[])[i],'Cantrip '+(i+1))).join('')+spSel(n,'s',null,BYC(cl,1),q.s,'คาถาเลเวล 1 (ร่ายฟรี 1 ครั้ง/พักยาว)')}
if(n=='Fey-Touched')x+=`<p class="muted">ได้ Misty Step ฟรี 1 ครั้ง/พักยาว</p>`+spSel(n,'s',null,SPL.filter(s=>s[1]==1&&['Divination','Enchantment'].includes(s[2])).map(s=>s[0]),q.s,'คาถาเลเวล 1 (Divination หรือ Enchantment)');
if(n=='Shadow-Touched')x+=`<p class="muted">ได้ Invisibility ฟรี 1 ครั้ง/พักยาว</p>`+spSel(n,'s',null,SPL.filter(s=>s[1]==1&&['Illusion','Necromancy'].includes(s[2])).map(s=>s[0]),q.s,'คาถาเลเวล 1 (Illusion หรือ Necromancy)');
if(n=='Telekinetic')x+=`<p class="muted">ได้ Mage Hand (มองไม่เห็นมือ)</p>`;
if(n=='Telepathic')x+=`<p class="muted">ได้ Detect Thoughts ฟรี 1 ครั้ง/พักยาว</p>`;
if(n=='Spell Sniper')x+=spSel(n,'s',null,[...new Set(['Cleric','Druid','Wizard'].flatMap(c=>BYC(c,0)))],q.s,'Cantrip ที่ต้องใช้ attack roll');
if(n=='Speedy')x+=`<p class="muted">ความเร็ว +10 ฟุต (คำนวณบนใบตัวละคร)</p>`;
if(n=='Alert')x+=`<p class="muted">Initiative +PB (คำนวณบนใบตัวละคร)</p>`;
if(n=='Tough')x+=`<p class="muted">HP สูงสุด +2 ต่อเลเวล (คำนวณบนใบตัวละคร)</p>`;
if(x)h+=`<h3>${n}</h3>${x}`});
return h?`<div class='card'><h3>ตัวเลือกของ Feat ที่เลือก</h3>${h}</div>`:''}
function feats(){const q=quota(),nm={O:'Origin Feat (จากภูมิหลัง)',G:'General Feat (เลือกแทน ASI ตั้งแต่เลเวล 4)',E:'Epic Boon (เลเวล 19)'},n=c=>FT.filter(f=>f[1]==c&&f[0]!='Ability Score Improvement'&&S.ft[f[0]]).length+(c=='G'?S.asi.length:0),F=fsc();
return `<div class='card'><p class='muted'>โควตาคำนวณจากคลาส เลเวล และสปีชีส์ที่เลือกในแท็บสร้างตัวละคร (Human ได้ Origin Feat เพิ่ม 1) ค่าพลังและคาถาที่ได้จาก Feat จะอัปเดตบนใบตัวละครทันที คำอธิบายเป็นสรุปย่อ ตรวจเงื่อนไขจริงที่ <a href='https://dnd-th.com/feats/' target='_blank' rel='noopener'>dnd-th.com/feats</a></p><div class='stats'>${['O','G','E'].map(c=>`<div><b style='${n(c)>q[c]?'color:var(--red)':''}'>${n(c)}/${q[c]}</b>${nm[c]}</div>`).join('')}</div><div class='ab' style='margin-top:10px'>${F.map((v,i)=>`<div><small>${ABK[i]}</small><b>${v}</b>${v!=S.sc[i]?`<small>(เดิม ${S.sc[i]})</small>`:''}</div>`).join('')}</div></div>
<div class='card'><h3>Ability Score Improvement (ASI)</h3><p class='muted'>ใช้ ASI แทน Feat: แต่ละครั้งเพิ่มค่าพลัง +1 สองครั้ง (เลือกค่าเดียวกันสองครั้ง = +2) สูงสุด 20</p>${S.asi.map((p,k)=>`<div>ครั้งที่ ${k+1}: ${[0,1].map(j=>`<select onchange="setAsi(${k},${j},+this.value)"><option value="-1">— เลือก —</option>${ABK.map((a,i)=>`<option value="${i}" ${p[j]===i?'selected':''}>${a}</option>`).join('')}</select>`).join(' ')}</div>`).join('')}<p><button class='b' onclick='asiAdd(1)'>+ เพิ่ม ASI</button> <button class='b' onclick='asiAdd(-1)'>ลบครั้งล่าสุด</button></p></div>
${featOpts()}${['O','G','E'].map(c=>`<h3>${nm[c]}</h3><div class='list card'>${FT.filter(f=>f[1]==c&&f[0]!='Ability Score Improvement').map(f=>`<label><input type=checkbox value='${f[0]}' ${S.ft[f[0]]?'checked':''} onchange=ftTog(this)><span>${f[0]}<small>${f[2]}</small></span></label>`).join('')}</div>`).join('')}`}
function render(){nav();$('#main').innerHTML=[builder,species,classes,levels,spells,items,feats][tab]();if(tab==0)upd();scrollTo(0,0)}
render();
</script>
</body>
</html>
